name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  lint:
    name: Lint (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: PHP syntax check (php -l sweep, non-vendor files)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>php_lint_err; then
              echo "::error file=$file::PHP syntax error"
              cat php_lint_err
              status=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          rm -f php_lint_err
          exit $status

      - name: Validate composer.json
        run: composer validate --no-check-all --strict

  test:
    name: PHPUnit (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies (incl. dev)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  committed-autoloader:
    # The committed vendor/ is consumed AS-IS by source installs — a release zip
    # or a Composer/Bedrock `dev-master` checkout — with NO `composer install`.
    # Dev packages (phpunit & friends) are gitignored and never shipped, so the
    # committed autoloader MUST be the no-dev (production) build: a dev autoloader
    # eager-requires unshipped files (e.g. myclabs/deep-copy's deep_copy.php) and
    # fatals on every front-end request. Boot it here, deliberately WITHOUT
    # `composer install`, so a dev-state autoloader can never be merged to master.
    name: Committed autoloader boots (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Boot committed vendor/autoload.php (no composer install)
        run: php -d display_errors=1 -r 'require "vendor/autoload.php"; echo "Committed production autoloader boots OK\n";'
